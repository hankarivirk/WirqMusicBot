[project]
name = "music-flow"
version = "1.0.0"
description = "A clean Telegram music player built for fast search, quick streaming, and simple queue control."
authors = [{ name = "MUSIC FLOW Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyrogram==2.0.106",
    "py-tgcalls==0.9.7",
    "motor>=3.3.0",
    "aiohttp>=3.8.5",
    "aiofiles>=23.2.1",
    "yt-dlp>=2024.08.06",
    "yt-search-python==2.2.1",
    "httpx>=0.28.1,<1.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "tgcrypto>=1.2.5",
    "psutil>=5.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
