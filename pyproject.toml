[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wirqmusic"
version = "2.7.8"
description = "High-performance Telegram Voice Chat Music Streamer and Management Bot"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Wirq Team" }]
dependencies = [
    "pyrotgfork==2.2.24",
    "py-tgcalls==2.3.3",
    "pymongo>=4.13.0,<5.0.0",
    "yt-dlp[default]>=2026.8.19,<2027.0.0",
    "aiohttp>=3.9.3,<4.0.0",
    "pillow>=10.2.0,<12.0.0",
    "tgcrypto>=1.2.5,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "psutil>=5.9.8,<8.0.0",
    "httpx>=0.27.0,<1.0.0",
    "uvloop>=0.21.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["anony*"]
