version: '3.8'

services:
  wirqmusic:
    build: .
    container_name: wirq_music_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./cache:/app/cache
      - ./downloads:/app/downloads
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
